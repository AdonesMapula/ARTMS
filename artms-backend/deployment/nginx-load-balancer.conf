# ==============================================================================
# ARTMS High-Performance Production Load Balancer & Reverse Proxy Configuration
# ==============================================================================

# Rate Limiting Zones (DDoS & Brute-force Mitigation)
limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=public_parser:10m rate=5r/m;

# Micro-Caching Definition (10MB metadata, 500MB max cache disk)
proxy_cache_path /var/cache/nginx/artms_api levels=1:2 keys_zone=artms_cache:20m max_size=500m inactive=10m use_temp_path=off;

# ── 1. Backend Laravel Application Cluster (Horizontal Load Balancing) ───────
upstream artms_backend_cluster {
    # Distribution Strategy: least_conn directs traffic to the server with fewest active connections
    least_conn;

    server 127.0.0.1:8001 max_fails=3 fail_timeout=10s weight=1;
    server 127.0.0.1:8002 max_fails=3 fail_timeout=10s weight=1;
    server 127.0.0.1:8003 max_fails=3 fail_timeout=10s weight=1;

    # Persistent keepalive connections between Nginx and PHP backend workers
    keepalive 64;
}

# ── 2. Frontend SPA Web Cluster (Static / Node / Vite Cluster) ────────────────
upstream artms_frontend_cluster {
    server 127.0.0.1:5173 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name artms.local localhost;

    # Redirect all plain HTTP traffic to HTTPS in production
    # return 301 https://$host$request_uri;

    # Client Request Limits
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # ── Gzip Compression Engine ───────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/vnd.ms-fontobject
        application/wasm
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/bmp
        image/svg+xml
        image/vnd.microsoft.icon
        text/cache-manifest
        text/calendar
        text/css
        text/javascript
        text/markdown
        text/plain
        text/xml
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # ── Security & Performance Headers ────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=*, microphone=*, geolocation=()" always;

    # ── Health Check Endpoint (Direct pass-through) ───────────────────────────
    location = /api/public/health {
        proxy_pass http://artms_backend_cluster/api/public/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    # ── High-Security Auth Endpoints (Rate limited strictly) ──────────────────
    location /api/auth/ {
        limit_req zone=api_auth burst=10 nodelay;

        proxy_pass http://artms_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Auth requests are NEVER cached
        proxy_cache_bypass 1;
        proxy_no_cache 1;
    }

    # ── General API Endpoints (Load Balanced with Microcaching) ───────────────
    location /api/ {
        limit_req zone=api_general burst=40 nodelay;

        proxy_pass http://artms_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Micro-caching configuration for GET requests
        proxy_cache artms_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$scheme$request_method$host$request_uri$http_authorization";
        proxy_cache_valid 200 302 5s;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;

        # Bypass cache for non-GET or mutation requests
        proxy_cache_bypass $http_cache_control;
        add_header X-Proxy-Cache $upstream_cache_status;

        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── Static Frontend Assets (Vite / React Build) ───────────────────────────
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf|wasm)$ {
        proxy_pass http://artms_frontend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Frontend SPA Route Handling ───────────────────────────────────────────
    location / {
        proxy_pass http://artms_frontend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
