services:
  # ── Nginx Load Balancer ───────────────────────────────────────────────────
  load-balancer:
    image: nginx:alpine
    container_name: artms-load-balancer
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-load-balancer.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - app-worker-1
      - app-worker-2
      - app-worker-3
      - frontend
    networks:
      - artms-network

  # ── Laravel Backend Replica 1 ─────────────────────────────────────────────
  app-worker-1:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: artms-backend-1
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=mysql
    depends_on:
      - redis
      - mysql
    networks:
      - artms-network

  # ── Laravel Backend Replica 2 ─────────────────────────────────────────────
  app-worker-2:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: artms-backend-2
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=mysql
    depends_on:
      - redis
      - mysql
    networks:
      - artms-network

  # ── Laravel Backend Replica 3 ─────────────────────────────────────────────
  app-worker-3:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: artms-backend-3
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=mysql
    depends_on:
      - redis
      - mysql
    networks:
      - artms-network

  # ── Frontend SPA Web Server (Vite / React Production) ─────────────────────
  frontend:
    build:
      context: ../../ARTMS-main
      dockerfile: Dockerfile
    container_name: artms-frontend
    restart: unless-stopped
    networks:
      - artms-network

  # ── Shared Redis Cache & Session Cluster ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: artms-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - artms-network

  # ── Primary MySQL Database ────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: artms-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: artms
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - artms-network

volumes:
  nginx-cache:
  redis-data:
  mysql-data:

networks:
  artms-network:
    driver: bridge
